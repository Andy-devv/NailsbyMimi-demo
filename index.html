function load() {

  } catch(e) { S.schedule = {...DEFAULT_SCHEDULE}; }
}

/* ─── Helpers ─── */
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const getSvc = id => SERVICES.find(s=>s.id===id);
const fmtTime = iso => { const d=new Date(iso),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM'; return `${h%12||12}:${String(m).padStart(2,'0')} ${ap}`; };
const fmtDate = iso => new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtDateLong = iso => new Date(iso).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const sameDay = (a,b) => { const da=new Date(a),db=new Date(b); return da.getFullYear()===db.getFullYear()&&da.getMonth()===db.getMonth()&&da.getDate()===db.getDate(); };
function getWeekDates(ref) {
  const d=new Date(ref),day=d.getDay(),mon=new Date(d);
  mon.setDate(d.getDate()-day+(day===0?-6:1));
  return Array.from({length:7},(_,i)=>{ const nd=new Date(mon); nd.setDate(mon.getDate()+i); return nd; });
}
function isAvailable(date, timeStr, serviceId) {
  const svc=getSvc(serviceId); if(!svc) return false;
  const [h,m]=timeStr.split(':').map(Number);
  const start=new Date(date); start.setHours(h,m,0,0);
  const end=new Date(start.getTime()+svc.duration*60000);
  const dow=start.getDay(), sc=S.schedule[dow]||DEFAULT_SCHEDULE[dow];
  if(!sc.open) return false;
  const [oh,om]=sc.start.split(':').map(Number),[ch,cm]=sc.end.split(':').map(Number);
  const startMin=h*60+m, endMin=startMin+svc.duration;
  if(startMin<oh*60+om||endMin>ch*60+cm) return false;
  for(const a of S.appointments){ const as=new Date(a.start),ae=new Date(a.end); if(start<ae&&end>as) return false; }
  for(const b of S.blockedTimes){ const bs=new Date(b.start),be=new Date(b.end); if(start<be&&end>bs) return false; }
  return true;
}

function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  S.page = page;
  renderNav();
  if(page==='home')       renderHome();
  if(page==='clientdash') renderClientDash();
  if(page==='book')       renderBooking();
  if(page==='myappts')    renderMyAppts();
  if(page==='dashboard')  renderOwnerDash();
  if(page==='auth')       renderAuth();
  document.getElementById('nav-menu').classList.remove('open');
  document.getElementById('hamburger').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}
 
function handleLogoClick() {
  if(!S.user) navigateTo('home');
  else if(S.user.isOwner) navigateTo('dashboard');
  else navigateTo('clientdash');
}
 
function renderNav() {
  const u = S.user;

  if(!u) {

      <li><a href="#" onclick="navigateTo('auth');return false" class="btn-nav">Book Now 💅</a></li>

function toast(msg, type='default') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type;
  void t.offsetWidth; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3200);
}

function doLogin(e) {
  e.preventDefault();
  const email=document.getElementById('li-email').value.trim().toLowerCase();
  const pass=document.getElementById('li-pass').value;
  if(email===OWNER_EMAIL&&pass===OWNER_PASS) {
    S.user={name:'Mimi',email:OWNER_EMAIL,isOwner:true};
    toast('Welcome back, Mimi! 👑','success'); navigateTo('dashboard'); return;
  }
  const u=S.users.find(u=>u.email===email&&u.password===pass);
  if(u) { S.user={name:u.name,email:u.email,phone:u.phone,isOwner:false}; toast(`Welcome back, ${u.name.split(' ')[0]}! 💕`,'success'); navigateTo('clientdash'); return; }
  toast('Invalid email or password','error');
}
function doSignup(e) {
  e.preventDefault();
  const first=document.getElementById('su-first').value.trim();
  const last=document.getElementById('su-last').value.trim();
  const email=document.getElementById('su-email').value.trim().toLowerCase();
  const phone=document.getElementById('su-phone').value.trim();
  const pass=document.getElementById('su-pass').value;
  if(S.users.find(u=>u.email===email)){toast('Account already exists','error');return;}
  const name=`${first} ${last}`;
  S.users.push({name,email,phone,password:pass});
  S.user={name,email,phone,isOwner:false};
  save(); toast(`Account created! Welcome, ${first}! 🌸`,'success'); navigateTo('clientdash');
}

function renderMyAppts() {
  const u = S.user;
  const now = new Date();
  const allMine = S.appointments.filter(a=>a.clientEmail===u.email);
  const upcoming = allMine.filter(a=>new Date(a.start)>=now && a.status!=='cancelled').sort((a,b)=>new Date(a.start)-new Date(b.start));
  const past = allMine.filter(a=>new Date(a.start)<now || a.status==='cancelled').sort((a,b)=>new Date(b.start)-new Date(a.start));
 
  const buildCard = (a, isPast) => {
    const svc = getSvc(a.serviceId);
    const status = a.status==='cancelled'?'cancelled':isPast?'past':'confirmed';
    const statusLabel = {confirmed:'Confirmed ✓',past:'Completed',cancelled:'Cancelled'}[status];
    const statusCls   = {confirmed:'status-confirmed',past:'status-past',cancelled:'status-cancelled'}[status];
    return `
      <div class="appt-card">
        <div class="appt-card-top">
          <div class="appt-card-svc">
            <span class="appt-card-icon">${svc?.icon||'💅'}</span>
            <div>
              <div class="appt-card-name">${svc?.name||a.serviceId}</div>
              <div class="appt-card-price">$${svc?.price} · ${svc?.duration} min</div>
            </div>
          </div>
          <span class="status-badge ${statusCls}">${statusLabel}</span>
        </div>
        <div class="appt-card-details">
          <div class="appt-detail-chip">
            <div class="chip-label">📅 Date</div>
            <div class="chip-value">${fmtDateLong(a.start)}</div>
          </div>
          <div class="appt-detail-chip">
            <div class="chip-label">⏰ Time</div>
            <div class="chip-value">${fmtTime(a.start)} – ${fmtTime(a.end)}</div>
          </div>
          <div class="appt-detail-chip">
            <div class="chip-label">📍 Where</div>
            <div class="chip-value">Nails by Mimi, Aurora</div>
          </div>
        </div>
        ${a.notes?`<div style="background:var(--pink-50);border-radius:var(--radius-sm);padding:.65rem .9rem;font-size:.85rem;color:var(--text)">📝 ${a.notes}</div>`:''}
        <div class="appt-card-actions">
          ${!isPast && a.status!=='cancelled' ? `<button class="btn-ghost danger" onclick="cancelMyAppt('${a.id}')">Cancel</button>` : ''}
          ${isPast || a.status==='cancelled' ? `<button class="btn-ghost" onclick="navigateTo('book')">Book Again</button>` : ''}
        </div>
      </div>`;
  };
 
  const upcomingHtml = upcoming.length
    ? upcoming.map(a=>buildCard(a,false)).join('')
    : `<div class="empty-state"><span class="empty-icon-lg">🗓</span><h3>No upcoming appointments</h3><p>Book your next nail session below!</p><button class="btn-primary" onclick="navigateTo('book')">Book Now 💅</button></div>`;
 
  const pastHtml = past.length
    ? past.map(a=>buildCard(a,true)).join('')
    : `<div class="empty-state" style="padding:1.5rem"><p style="color:var(--muted);font-size:.88rem">No past appointments yet.</p></div>`;
 
  document.getElementById('page-myappts').innerHTML = `
    <div class="my-appts-page">
      <div class="my-appts-hero">
        <div class="section-tag" style="background:rgba(255,255,255,.15);color:#fff">Your History</div>
        <h1>My Appointments</h1>
        <p>Track your upcoming sessions and past visits</p>
      </div>
      <div class="my-appts-body">
        <div style="margin-bottom:1rem;display:flex;justify-content:flex-end">
          <button class="btn-primary btn-sm" onclick="navigateTo('book')">+ New Appointment</button>
        </div>
        <div class="appts-section-header">
          <h2>Upcoming</h2>
          <span class="appt-count-badge">${upcoming.length}</span>
        </div>
        ${upcomingHtml}
        <div class="appts-section-header" style="margin-top:2rem">
          <h2>Past & Cancelled</h2>
          <span class="appt-count-badge">${past.length}</span>
        </div>
        ${pastHtml}
      </div>
    </div>`;
}

  const a = S.appointments.find(a=>a.id===id);

}

function renderBookCal() {
  const grid=document.getElementById('cal-grid'),label=document.getElementById('cal-label'); if(!grid) return;
  const now=new Date(),y=B.calYear,m=B.calMonth;
  const firstDay=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  label.textContent=`${months[m]} ${y}`;
  let html=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-day-label">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++) html+=`<div class="cal-day empty"></div>`;
  for(let day=1;day<=days;day++){
    const date=new Date(y,m,day);
    const isPast=date<new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const dow=date.getDay(),sc=S.schedule[dow]||DEFAULT_SCHEDULE[dow];
    const blocked=!sc.open,isToday=sameDay(date,now),isSel=B.date&&sameDay(date,B.date);
    let cls='cal-day';
    if(isPast) cls+=' past'; else if(blocked) cls+=' blocked';
    if(isToday) cls+=' today'; if(isSel) cls+=' selected';
    const dis=(isPast||blocked)?'disabled':`onclick="selectDate(${y},${m},${day})"`;
    html+=`<button class="${cls}" ${dis}>${day}</button>`;
  }
  grid.innerHTML=html;
}
 
function bookCalNav(d){ B.calMonth+=d; if(B.calMonth>11){B.calMonth=0;B.calYear++;} if(B.calMonth<0){B.calMonth=11;B.calYear--;} renderBookCal(); }
function selectDate(y,m,d){ B.date=new Date(y,m,d); B.time=null; renderBookCal(); renderTimes(); renderSummary(); }
 
function renderTimes() {
  const note=document.getElementById('time-note'),wrap=document.getElementById('time-slots'); if(!note||!wrap) return;
  if(!B.svc||!B.date){ note.style.display='block'; note.textContent='Select a service and date first.'; wrap.style.display='none'; return; }
  const dow=B.date.getDay(),sc=S.schedule[dow]||DEFAULT_SCHEDULE[dow];
  if(!sc.open){ note.style.display='block'; note.textContent='Mimi is closed on this day.'; wrap.style.display='none'; return; }
  const [oh,om]=sc.start.split(':').map(Number),[ch,cm]=sc.end.split(':').map(Number);
  const slots=[]; let cur=oh*60+om;
  while(cur+30<=ch*60+cm){ const hh=String(Math.floor(cur/60)).padStart(2,'0'),mm=String(cur%60).padStart(2,'0'); slots.push(`${hh}:${mm}`); cur+=30; }
  note.style.display='none'; wrap.style.display='grid';
  wrap.innerHTML=slots.map(s=>{
    const avail=isAvailable(B.date,s,B.svc);
    const [h,m]=s.split(':').map(Number),ap=h>=12?'PM':'AM',h12=h%12||12;
    const label=`${h12}:${String(m).padStart(2,'0')} ${ap}`;
    return `<div class="time-slot ${B.time===s?'selected':''} ${!avail?'booked':''}" ${avail?`onclick="selectTime('${s}')"`:''}>${label}</div>`;
  }).join('');
}
 
function selectTime(t){ B.time=t; renderTimes(); renderSummary(); }
 
function renderSummary() {
  const body=document.getElementById('summary-body'); if(!body) return;
  const svc=getSvc(B.svc);
  if(!B.svc&&!B.date&&!B.time){ body.innerHTML=`<p style="color:var(--muted);font-size:.88rem">Choose a service, date, and time to continue.</p>`; return; }
  const timeStr=B.time?(()=>{ const[h,m]=B.time.split(':').map(Number),ap=h>=12?'PM':'AM'; return `${h%12||12}:${String(m).padStart(2,'0')} ${ap}`; })():'—';
  const endStr=svc&&B.time?(()=>{ const[h,m]=B.time.split(':').map(Number),em=h*60+m+svc.duration,eh=Math.floor(em/60),emm=em%60,ap=eh>=12?'PM':'AM'; return `${eh%12||12}:${String(emm).padStart(2,'0')} ${ap}`; })():'';
  const ready=B.svc&&B.date&&B.time;
  body.innerHTML=`
    <div style="display:grid;gap:.8rem;margin-bottom:1.4rem">
      <div style="display:flex;align-items:center;gap:10px;padding:.7rem;background:var(--pink-50);border-radius:var(--radius-sm)">
        <span style="font-size:1.4rem">${svc?svc.icon:'❓'}</span>
        <div><div style="font-weight:700;color:var(--dark)">${svc?svc.name:'No service selected'}</div>${svc?`<div style="font-size:.78rem;color:var(--muted)">${svc.duration} min · $${svc.price}</div>`:''}</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.88rem;padding:0 .2rem">
        <span style="color:var(--muted);font-weight:600">📅 Date</span>
        <span style="font-weight:700;color:var(--dark)">${B.date?B.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'—'}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.88rem;padding:0 .2rem">
        <span style="color:var(--muted);font-weight:600">⏰ Time</span>
        <span style="font-weight:700;color:var(--dark)">${timeStr}${endStr?' – '+endStr:''}</span>
      </div>
      ${svc?`<div style="display:flex;justify-content:space-between;font-size:.88rem;padding:.7rem .2rem 0;border-top:1px solid var(--border)"><span style="color:var(--muted);font-weight:600">💰 Total</span><span style="font-weight:800;font-size:1.05rem;color:var(--pink-600)">$${svc.price}</span></div>`:''}
    </div>
    ${ready?`<button class="btn-primary" style="width:100%;justify-content:center" onclick="openConfirm()">Review & Confirm ✓</button>`:`<p style="font-size:.8rem;color:var(--muted);text-align:center">Complete all selections to book.</p>`}`;
}
 
function openConfirm() {
  if(!B.svc||!B.date||!B.time) return;
  const svc=getSvc(B.svc);
  const[h,m]=B.time.split(':').map(Number),ap=h>=12?'PM':'AM',h12=h%12||12;
  const tl=`${h12}:${String(m).padStart(2,'0')} ${ap}`;
  const em=h*60+m+svc.duration,eh=Math.floor(em/60),emm=em%60,eap=eh>=12?'PM':'AM';
  const el=`${eh%12||12}:${String(emm).padStart(2,'0')} ${eap}`;
  document.getElementById('confirm-body').innerHTML=`
    <div style="background:var(--pink-50);border-radius:var(--radius-sm);padding:1rem;margin-bottom:.5rem;display:grid;gap:.5rem;font-size:.92rem">
      <div><strong>Service:</strong> ${svc.icon} ${svc.name}</div>
      <div><strong>Date:</strong> ${B.date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
      <div><strong>Time:</strong> ${tl} – ${el}</div>
      <div><strong>Client:</strong> ${S.user.name}</div>
      <div style="border-top:1px solid var(--border);padding-top:.5rem;font-weight:800;color:var(--pink-600)">Total: $${svc.price}</div>
    </div>`;
  openModal('confirm-modal');
}
 
function confirmBooking() {
  if(!B.svc||!B.date||!B.time) return;
  const svc=getSvc(B.svc);
  const[h,m]=B.time.split(':').map(Number);
  const start=new Date(B.date); start.setHours(h,m,0,0);
  const end=new Date(start.getTime()+svc.duration*60000);
  S.appointments.push({id:genId(),clientName:S.user.name,clientEmail:S.user.email,
    serviceId:B.svc,start:start.toISOString(),end:end.toISOString(),status:'confirmed',
    notes:document.getElementById('book-notes')?.value||''});
  save(); closeModal('confirm-modal');
  B={svc:null,date:null,time:null,calMonth:new Date().getMonth(),calYear:new Date().getFullYear()};
  toast('Appointment booked! See you soon 🎉','success');
  navigateTo('myappts');
}
 
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function renderWeeklyCal(){
  const hdr=document.getElementById('wg-hdr'),body=document.getElementById('wg-body'),lbl=document.getElementById('week-label');
  if(!hdr||!body) return;
  const dates=getWeekDates(dashWeekRef),today=new Date();
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const opts={month:'short',day:'numeric'};
  lbl.textContent=`${dates[0].toLocaleDateString('en-US',opts)} – ${dates[6].toLocaleDateString('en-US',opts)}, ${dates[0].getFullYear()}`;
  hdr.innerHTML=`<div class="wg-corner"></div>`+dates.map((d,i)=>{
    const isT=sameDay(d,today);
    return `<div class="wg-day-head ${isT?'today':''}"><div class="day-name">${dayNames[i]}</div><div class="day-num">${d.getDate()}</div></div>`;
  }).join('');
  const hours=[];
  for(let h=CAL_START;h<=CAL_END;h++) hours.push(h===12?'12 PM':h>12?`${h-12} PM`:`${h} AM`);
  const totalH=(CAL_END-CAL_START+1)*HOUR_H;
  let timeCells=hours.map(h=>`<div class="wg-time-cell">${h}</div>`).join('');
  body.innerHTML=`<div>${timeCells}</div>`+dates.map(d=>{
    const isT=sameDay(d,today);
    const dow=d.getDay(),sc=S.schedule[dow]||DEFAULT_SCHEDULE[dow];
    const lines=hours.map(()=>`<div class="wg-hour-line"></div>`).join('');
    const apptBlocks=S.appointments.filter(a=>sameDay(a.start,d)).map(a=>{
      const svc=getSvc(a.serviceId),start=new Date(a.start),end=new Date(a.end);
      const top=((start.getHours()+start.getMinutes()/60)-CAL_START)*HOUR_H;
      const height=((end-start)/3600000)*HOUR_H;
      if(top<0) return '';
      return `<div class="appt-block ${svc?.color||'appt-manicure'}" style="top:${top}px;height:${Math.max(height-2,20)}px" onclick="showApptDetail('${a.id}')" title="${a.clientName}">
        <div class="ab-name">${a.clientName}</div>
        <div class="ab-svc">${svc?.name||a.serviceId}</div>
        <div class="ab-time">${fmtTime(a.start)}</div>
      </div>`;
    }).join('');
    const blkBlocks=S.blockedTimes.filter(b=>sameDay(b.start,d)).map(b=>{
      const bs=new Date(b.start),be=new Date(b.end);
      const top=((bs.getHours()+bs.getMinutes()/60)-CAL_START)*HOUR_H;
      const height=((be-bs)/3600000)*HOUR_H;
      if(top<0) return '';
      return `<div class="blocked-block" style="top:${top}px;height:${Math.max(height,20)}px"><div class="blocked-label">${b.label}</div></div>`;
    }).join('');
    const closedOverlay=!sc.open?`<div style="position:absolute;inset:0;background:rgba(245,245,245,.7);display:flex;align-items:center;justify-content:center;z-index:3"><span style="font-size:.68rem;font-weight:700;color:#bbb;writing-mode:vertical-lr;transform:rotate(180deg);letter-spacing:.07em">CLOSED</span></div>`:'';
    return `<div class="wg-day-col ${isT?'today-col':''}" style="position:relative;height:${totalH}px">${lines}${closedOverlay}${blkBlocks}${apptBlocks}</div>`;
  }).join('');
}

function renderBlockedList(){

  w.innerHTML=future.length?future.map(b=>`

function setBlockDefaults(){
  const now=new Date(),pad=n=>String(n).padStart(2,'0');
  const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const s=document.getElementById('blk-start'),e=document.getElementById('blk-end');
  if(s) s.value=fmt(now);
  if(e){ const later=new Date(now.getTime()+3600000); e.value=fmt(later); }
}
 
function openBlockModal(){ openModal('block-modal'); setBlockDefaults(); }
 
function doBlock(e){
  e.preventDefault();
  const lbl=document.getElementById('blk-lbl').value.trim();
  const start=document.getElementById('blk-start').value;
  const end=document.getElementById('blk-end').value;
  if(new Date(end)<=new Date(start)){ toast('End must be after start','error'); return; }
  S.blockedTimes.push({id:genId(),label:lbl,start:new Date(start).toISOString(),end:new Date(end).toISOString()});
  save(); closeModal('block-modal'); toast('Time blocked 🚫','success'); renderWeeklyCal(); renderBlockedList();
}
 
function removeBlock(id){ S.blockedTimes=S.blockedTimes.filter(b=>b.id!==id); save(); renderWeeklyCal(); renderBlockedList(); toast('Block removed'); }
 
function openSchedModal(){
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('sched-grid').innerHTML=days.map((name,i)=>{

    return `<div class="schedule-row">

function saveSched(){
  for(let i=0;i<7;i++) S.schedule[i]={open:document.getElementById(`sc-o-${i}`)?.checked||false,start:document.getElementById(`sc-s-${i}`)?.value||'09:00',end:document.getElementById(`sc-e-${i}`)?.value||'18:00'};
  save(); closeModal('sched-modal'); toast('Schedule updated! 🗓','success'); renderWeeklyCal();
}

      <button class="btn-primary" style="flex:1;justify-content:center;background:linear-gradient(135deg,#e57373,#c62828)" onclick="ownerCancelAppt('${id}')">Cancel Appt</button>
    </div>`;
  openModal('appt-detail-modal');
}
 
function ownerCancelAppt(id){
  if(!confirm('Cancel this appointment?')) return;
  S.appointments=S.appointments.filter(a=>a.id!==id);
  save(); closeModal('appt-detail-modal'); toast('Appointment cancelled'); renderOwnerDash();
}
 
function exportCSV(){
  const rows=['Client,Email,Service,Date,Start,End,Price,Notes'];
  S.appointments.forEach(a=>{ const svc=getSvc(a.serviceId); rows.push([a.clientName,a.clientEmail,svc?.name||a.serviceId,fmtDate(a.start),fmtTime(a.start),fmtTime(a.end),svc?.price||'',`"${(a.notes||'').replace(/"/g,'""')}"`].join(',')); });
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob),el=document.createElement('a');
  el.href=url; el.download='nailsbymimi-appointments.csv'; el.click(); URL.revokeObjectURL(url);
  toast('Exported! 📥','success');
}
 
/* ─── Scroll reveal ─── */
function observeReveal(){
  const obs=new IntersectionObserver(entries=>entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); }),{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}

load(); seedDemo();
document.getElementById('nav-logo-img').src = LOGO_SRC;
navigateTo('home');
</script>
